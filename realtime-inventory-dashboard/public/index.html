<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Inventory Management Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>LiveStock Inventory</h1>
      <span id="connection-status" class="status-badge disconnected">Connecting...</span>
    </div>
    <div class="controls">
      <div class="currency-toggle">
        <span>Currency:</span>
        <button id="btn-usd" class="active" onclick="setCurrency('USD')">USD ($)</button>
        <button id="btn-inr" onclick="setCurrency('INR')">INR (₹)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- KPI Cards -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <h3>Total SKUs</h3>
        <p id="kpi-skus">0</p>
      </div>
      <div class="kpi-card">
        <h3>Total Units in Stock</h3>
        <p id="kpi-units">0</p>
      </div>
      <div class="kpi-card">
        <h3>Total Inventory Valuation</h3>
        <p id="kpi-valuation">$0.00</p>
      </div>
      <div class="kpi-card alert">
        <h3>Low Stock Alerts</h3>
        <p id="kpi-low-stock">0</p>
      </div>
    </section>

    <div class="main-grid">
      <!-- Inventory Management Section -->
      <section class="panel inventory-panel">
        <div class="panel-header">
          <h2>Inventory Items</h2>
        </div>

        <form id="add-item-form" class="add-form">
          <input type="text" id="sku" placeholder="SKU (e.g. SKU-101)" required />
          <input type="text" id="name" placeholder="Product Name" required />
          <input type="text" id="category" placeholder="Category" value="Electronics" />
          <input type="number" id="quantity" placeholder="Qty" min="0" required />
          <input type="number" id="unitPriceUSD" placeholder="Price (USD)" step="0.01" min="0" required />
          <button type="submit" class="btn-primary">+ Add Item</button>
        </form>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Product</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Unit Price</th>
                <th>Total Value</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventory-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- Live Activity Logs Panel -->
      <section class="panel logs-panel">
        <div class="panel-header">
          <h2>Live Activity Log</h2>
        </div>
        <ul id="activity-log-list" class="log-list"></ul>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
